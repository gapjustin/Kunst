<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Betting Game</title>

<style>
:root {
  --primary: #0f2a44;
  --secondary: #1f7a8c;
  --accent: #f2c94c;
  --light: #f7f9fb;
  --muted: #8a9aa9;
  --dark: #071521;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Segoe UI", system-ui;
  background: radial-gradient(circle at top, #0f2a44, #071521);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: white;
}

/* CONTAINER */
.container {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 2.5rem;
  max-width: 760px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

/* HEADER */
.logo {
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--accent);
  margin-bottom: 1rem;
  text-transform: uppercase;
}

h1 {
  font-size: 2.2rem;
  margin-bottom: 0.5rem;
}

h1 span {
  color: var(--accent);
}

p {
  color: #c8d3dc;
  margin-bottom: 2rem;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.06);
  padding: 1.2rem;
  border-radius: 12px;
  margin-bottom: 1rem;
  transition: 0.2s;
  border: 1px solid rgba(255,255,255,0.08);
}

.card:hover {
  transform: translateY(-3px);
  border-color: var(--accent);
}

/* QUESTION */
.question {
  font-weight: 600;
  margin-bottom: 0.8rem;
}

/* OPTIONS */
.options {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
}

.options button {
  flex: 1;
  min-width: 80px;
  padding: 0.6rem;
  background: transparent;
  border: 1px solid #3a5568;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.options button:hover {
  border-color: var(--accent);
  background: rgba(242,201,76,0.15);
}

.options button.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}

/* INPUT */
input {
  width: 100%;
  padding: 0.6rem;
  border-radius: 8px;
  border: none;
  margin-top: 0.4rem;
}

/* SUBMIT */
.submit-btn {
  margin-top: 1.5rem;
  padding: 1rem;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #f2c94c, #f2994a);
  color: black;
  font-weight: 700;
  width: 100%;
  font-size: 1rem;
  cursor: pointer;
  transition: 0.25s;
}

.submit-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 10px 25px rgba(242,201,76,0.4);
}

footer {
  margin-top: 2rem;
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
}

.odds {
  font-size: 0.8rem;
  color: #9fbcd1;
  margin-top: 0.3rem;
}
</style>

</head>

<body>

<main class="container">

<div class="logo">Pelimarket</div>

<h1>
Plaats je <span>voorspelling</span>
</h1>

<p>
Selecteer je keuzes en claim abstracte winst (of abstract verlies).
</p>

<form action="https://docs.google.com/forms/d/e/1FAIpQLSeCJNxcRrJFzrLxwN7ReKDiTuW_NdvlLkYxKlcCElP8FUK7sQ/formResponse" method="POST" target="hidden_iframe" onsubmit="handleSubmit()">
<!-- NAAM -->
<div class="card">
  <div class="question">Naam</div>
  <input type="text" name="entry.323509142" required>
</div>


<!-- BONUS -->
<div class="card">
  <div class="question">Welk land gaan we?</div>
  <input type="text" name="entry.1023742829">
</div>

<!-- VRAAG 1 -->
<div class="card">
  <div class="question">Hoe veel ICE zal er gevonden worden?</div>
  <div class="odds">Dit is je officiele waarschuwing :)</div>
  <div class="options">
    <button type="button" onclick="selectOption(this, 'entry.222222222', '0')">0</button>
    <button type="button" onclick="selectOption(this, 'entry.222222222', '1-5')">1-5</button>
    <button type="button" onclick="selectOption(this, 'entry.222222222', '6-10')">6-10</button>
    <button type="button" onclick="selectOption(this, 'entry.222222222', '11-20')">11-20</button>
    <button type="button" onclick="selectOption(this, 'entry.222222222', '21-50')">21-50</button>
    <button type="button" onclick="selectOption(this, 'entry.222222222', '51-100')">51-100</button>
    <button type="button" onclick="selectOption(this, 'entry.222222222', '100+')">100+</button>
  </div>
</div>

<!-- hidden inputs voor buttons -->
<input type="hidden" name="entry.400504843" id="entry.222222222">

<button class="submit-btn" type="submit">
🔥 Submit Bet
</button>

</form>

<footer>
© 2026 Pelimarket — De enige abstracte market
</footer>
<iframe name="hidden_iframe" style="display:none;"></iframe>
</main>

<script>
function selectOption(button, fieldName, value) {
  // remove active from siblings
  const buttons = button.parentElement.querySelectorAll('button');
  buttons.forEach(btn => btn.classList.remove('active'));

  // activate clicked
  button.classList.add('active');

  // set hidden input value
  document.getElementById(fieldName).value = value;
}
function handleSubmit() {
  setTimeout(() => {
    window.location.href = "https://www.hjcpelikaan.com/BetMade";
  }, 500);
}
</script>

</script>

</body>
</html>
